server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    location = /health/live { default_type application/json; return 200 '{"status":"healthy"}'; }
    location = /health/ready { default_type application/json; return 200 '{"status":"healthy"}'; }
    location / { try_files $uri $uri/ /index.html; }
}
