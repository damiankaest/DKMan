[project]
name = "dkman-app-starter"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi==0.147.0", "uvicorn[standard]==0.54.0", "sqlalchemy==2.1.5", "alembic==1.20.0", "psycopg[binary]==3.3.6"]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx2==2.14.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
