[project]
name = "dkman"
version = "0.1.0"
description = "Private service platform with a policy-controlled orchestration core"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.147.0", "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.5", "alembic==1.20.0",
  "pydantic-settings==2.16.1", "psycopg[binary]==3.3.6",
  "PyJWT[crypto]==2.15.1", "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
  "jsonschema==4.26.0",
  "httpx2==2.14.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/dkman", "backend/notes_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
markers = [
  "postgres: requires DKMAN_TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
  "docker: requires an explicitly disposable GitHub Actions Docker runner",
  "buildkit: requires an explicitly disposable isolated BuildKit worker",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["backend/dkman", "backend/notes_demo"]
strict = true
