# Explicit opt-in overlay; use with compose.yaml and -p dkman. No new host port.
services:
  core:
    environment:
      DKMAN_DEPLOYMENT_ENABLED: 'true'
    secrets: [core-db-password, adapter-delegation-key]
    volumes:
      - ../../.local/adapter/catalog.json:/etc/dkman-adapter/catalog.json:ro
    networks: [data, edge, adapter-control, app-gateway]

  hub:
    networks: [edge, app-gateway]

  adapter-migrate:
    labels: {io.dkman.managed: 'true'}
    image: dkman/deployment-adapter:0.1.0
    build: {context: ../.., dockerfile: infrastructure/deployment-adapter/Dockerfile}
    command: [python, -m, dkman.deployment_adapter.journal, --state-root, /var/lib/dkman-adapter]
    volumes: [adapter-state:/var/lib/dkman-adapter]
    networks: [adapter-control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  deployment-adapter:
    labels: {io.dkman.managed: 'true'}
    image: dkman/deployment-adapter:0.1.0
    build: {context: ../.., dockerfile: infrastructure/deployment-adapter/Dockerfile}
    restart: unless-stopped
    group_add: ['${DKMAN_DOCKER_SOCKET_GID:?Set the verified local Linux socket GID}']
    secrets: [adapter-delegation-key, adapter-data-key]
    volumes:
      - adapter-state:/var/lib/dkman-adapter
      - ../../.local/adapter/catalog.json:/etc/dkman-adapter/catalog.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [adapter-control]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      adapter-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health/ready',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

volumes:
  adapter-state:
networks:
  adapter-control: {internal: true}
  app-gateway:
    name: dkman-app-gateway
    internal: true
    labels: {io.dkman.gateway: 'true', io.dkman.managed: 'true'}
secrets:
  adapter-delegation-key: {file: ../../.local/secrets/adapter-delegation-key}
  adapter-data-key: {file: ../../.local/secrets/adapter-data-key}
