name: dkman

x-core-environment: &core-environment
  DKMAN_DB_HOST: postgres
  DKMAN_DB_PASSWORD_FILE: /run/secrets/core-db-password
  DKMAN_PUBLIC_URL: ${DKMAN_PUBLIC_URL:-http://localhost:8080}
  DKMAN_OIDC_ISSUER: ${DKMAN_PUBLIC_URL:-http://localhost:8080}/auth/realms/dkman
  DKMAN_OIDC_JWKS_URL: http://keycloak:8080/auth/realms/dkman/protocol/openid-connect/certs
  DKMAN_OIDC_AUDIENCE: dkman-api

services:
  postgres:
    labels: &managed-labels
      io.dkman.managed: 'true'
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets: [postgres-password, core-db-password, keycloak-db-password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    cpus: 1
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  migrate:
    labels: *managed-labels
    image: dkman/core:0.1.0
    build: {context: ../.., dockerfile: backend/Dockerfile}
    command: [alembic, -c, backend/alembic.ini, upgrade, head]
    environment: *core-environment
    secrets: [core-db-password]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging

  core:
    labels: *managed-labels
    image: dkman/core:0.1.0
    build: {context: ../.., dockerfile: backend/Dockerfile}
    restart: unless-stopped
    environment: *core-environment
    secrets: [core-db-password]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [data, edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m
    cpus: 1
    logging: *logging

  keycloak:
    labels: *managed-labels
    image: dkman/keycloak:26.8.1
    build: {context: ../.., dockerfile: infrastructure/keycloak/Dockerfile}
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: dkman_identity
      KC_HOSTNAME: ${DKMAN_PUBLIC_URL:-http://localhost:8080}/auth
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: bootstrap-admin
    secrets: [keycloak-db-password, keycloak-admin-password]
    volumes:
      - ../../.local/keycloak/dkman-realm.json:/opt/keycloak/data/import/dkman-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data, edge]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, /bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    mem_limit: 1g
    cpus: 2
    logging: *logging

  hub:
    labels: *managed-labels
    image: dkman/service-hub:0.1.0
    build: {context: ../.., dockerfile: apps/service-hub/Dockerfile}
    restart: unless-stopped
    ports: ['127.0.0.1:${DKMAN_HTTP_PORT:-8080}:8080']
    depends_on:
      core: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    networks: [edge]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

volumes:
  postgres-data:
networks:
  data: {internal: true}
  edge:
secrets:
  postgres-password: {file: ../../.local/secrets/postgres-password}
  core-db-password: {file: ../../.local/secrets/core-db-password}
  keycloak-db-password: {file: ../../.local/secrets/keycloak-db-password}
  keycloak-admin-password: {file: ../../.local/secrets/keycloak-admin-password}
