limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log off;
    client_max_body_size 64k;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://core:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        proxy_pass http://core:8000;
    }
    location /auth/ {
        # Keycloak sets its own CSP: login and account pages have different requirements.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
    # Fixed UUID-derived DNS alias and port. No URL, hostname or port from a request.
    resolver 127.0.0.11 valid=5s ipv6=off;
    location ~ "^/run/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/(.*)$" {
        limit_req zone=api burst=60 nodelay;
        set $app_upstream dkman-app-$1-web;
        set $app_path $2;
        proxy_pass http://$app_upstream:8080/$app_path$is_args$args;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Subject "";
        proxy_read_timeout 10s;
        proxy_redirect off;
    }
    location /run/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
