name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: dkman_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dkman_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DKMAN_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/dkman_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check backend scripts tests
      - run: uv run ruff format --check backend scripts tests
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/smoke_core.py
      - shell: pwsh
        run: ./scripts/check_powershell.ps1
      - run: uv run python scripts/export_contracts.py
      - run: git diff --exit-code -- contracts
      - run: uv run python scripts/validate_manifests.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/service-hub}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/service-hub/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate:api
      - run: git diff --exit-code -- src/generated/api.ts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_local_config.py
      - run: docker compose --env-file .env -f infrastructure/compose/compose.yaml config --quiet
      - run: docker compose --env-file .env -f infrastructure/compose/compose.yaml up -d --build --wait --wait-timeout 300
      - run: docker compose --env-file .env -f infrastructure/compose/compose.yaml run --rm --no-deps core python -m dkman.seed
      - run: bash scripts/linux/doctor.sh
      - name: Show service startup logs on failure
        if: failure()
        run: docker compose --env-file .env -f infrastructure/compose/compose.yaml logs --tail=100 core migrate keycloak hub
      - name: Stop disposable CI stack
        if: always()
        run: docker compose --env-file .env -f infrastructure/compose/compose.yaml down
