name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: dkman_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dkman_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DKMAN_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/dkman_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check backend scripts tests
      - run: uv run ruff format --check backend scripts tests
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv run python scripts/smoke_core.py
      - shell: pwsh
        run: ./scripts/check_powershell.ps1
      - run: uv run python scripts/export_contracts.py
      - run: git diff --exit-code -- contracts
      - run: uv run python scripts/validate_manifests.py
      - name: Verify Forge check dependency lock
        run: uv export --project backend/dkman/forge/starter_assets/api --frozen --group dev --no-emit-project --format requirements-txt --no-header --no-annotate --quiet | cmp - backend/dkman/forge/worker_assets/requirements-check.lock

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/service-hub}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/service-hub/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run generate:api
      - run: git diff --exit-code -- src/generated/api.ts
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build && npm audit --omit=dev --audit-level=high
        working-directory: apps/notes/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  adapter-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DKMAN_DISPOSABLE_DOCKER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest tests/test_adapter_docker.py -q

  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_local_config.py
      - run: docker compose --env-file .env -f infrastructure/compose/compose.yaml config --quiet
      - name: Validate optional model overlay without contacting a model
        env:
          DKMAN_CHAT_API_URL: https://model.example/v1/chat/completions
          DKMAN_CHAT_MODEL: contract-test
        run: docker compose --env-file .env -f infrastructure/compose/compose.yaml -f infrastructure/compose/chat-model.yaml config --quiet
      - run: docker compose --env-file .env -f infrastructure/compose/compose.yaml up -d --build --wait --wait-timeout 300
      - run: docker compose --env-file .env -f infrastructure/compose/compose.yaml run --rm --no-deps core python -m dkman.seed
      - run: bash scripts/linux/doctor.sh
      - name: Show service startup logs on failure
        if: failure()
        run: docker compose --env-file .env -f infrastructure/compose/compose.yaml logs --tail=100 core migrate keycloak hub
      - name: Stop disposable CI stack
        if: always()
        run: docker compose --env-file .env -f infrastructure/compose/compose.yaml down

  notes-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DKMAN_DISPOSABLE_DOCKER_TEST: '1'
      DKMAN_DISPOSABLE_BUILDKIT_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: uv sync --frozen
      - name: Install verified CI BuildKit
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/buildkit.tar.gz" https://github.com/moby/buildkit/releases/download/v0.34.1/buildkit-v0.34.1.linux-amd64.tar.gz
          echo "a59539daf547fe0958efe2d07e41c0a6944e1112a66d7e519ec1cf5b673ef15b  $RUNNER_TEMP/buildkit.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/buildkit" "$RUNNER_TEMP/dkman-buildkit"
          tar -xzf "$RUNNER_TEMP/buildkit.tar.gz" -C "$RUNNER_TEMP/buildkit"
          echo "$RUNNER_TEMP/buildkit/bin" >> "$GITHUB_PATH"
          echo "DKMAN_TEST_BUILDKIT_SOCKET=unix://$RUNNER_TEMP/dkman-buildkit/buildkitd.sock" >> "$GITHUB_ENV"
          sudo env PATH="$RUNNER_TEMP/buildkit/bin:/usr/sbin:/usr/bin:/sbin:/bin" "$RUNNER_TEMP/buildkit/bin/buildkitd" --addr "unix://$RUNNER_TEMP/dkman-buildkit/buildkitd.sock" --root "$RUNNER_TEMP/buildkit-state" > "$RUNNER_TEMP/buildkit.log" 2>&1 &
          for attempt in $(seq 1 40); do
            test -S "$RUNNER_TEMP/dkman-buildkit/buildkitd.sock" && break
            sleep 1
          done
          test -S "$RUNNER_TEMP/dkman-buildkit/buildkitd.sock"
          sudo chmod 666 "$RUNNER_TEMP/dkman-buildkit/buildkitd.sock"
      - run: uv run python scripts/generate_adapter_config.py --apply --confirm ADAPTER_CONFIG
      - run: uv run python scripts/build_notes.py --apply --confirm BUILD_NOTES
      - run: python3 scripts/generate_local_config.py && python3 tests/prepare_notes_journey.py
      - run: uv run python tests/prepare_forge_journey.py
      - name: Start isolated runtime stack
        run: |
          export DKMAN_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)
          docker compose -p dkman --env-file .env -f infrastructure/compose/compose.yaml -f infrastructure/compose/runtime.yaml -f infrastructure/compose/forge-attestation.yaml -f infrastructure/compose/forge-preview.yaml -f infrastructure/compose/forge-deployment.yaml -f tests/notes-faults.compose.yaml config --quiet
          docker compose -p dkman --env-file .env -f infrastructure/compose/compose.yaml -f infrastructure/compose/runtime.yaml -f infrastructure/compose/forge-attestation.yaml -f infrastructure/compose/forge-preview.yaml -f infrastructure/compose/forge-deployment.yaml -f tests/notes-faults.compose.yaml up -d --build --wait --wait-timeout 300
          docker compose -p dkman --env-file .env -f infrastructure/compose/compose.yaml -f infrastructure/compose/runtime.yaml -f infrastructure/compose/forge-attestation.yaml -f infrastructure/compose/forge-preview.yaml -f infrastructure/compose/forge-deployment.yaml -f tests/notes-faults.compose.yaml run --rm --no-deps core python -m dkman.seed
      - run: npm ci --ignore-scripts --no-audit --no-fund && npx playwright install --with-deps chromium && npm run test:journey
        working-directory: apps/service-hub
      - run: python3 tests/verify_notes_container.py
      - name: Save actual immutable build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notes-build-evidence
          include-hidden-files: true
          path: |
            .local/adapter/notes-build.json
            .local/adapter/catalog.json
            .local/notes-lifecycle.json
            .local/notes-lifecycle-jobs.json
            .local/notes-faults.json
            .local/notes-fault-results.json
            .local/notes-operation-evidence.json
            .local/planning-journey.json
            .local/chat-journey.json
            .local/forge-journey.json
      - name: Show sanitized startup state on failure
        if: failure()
        run: |
          export DKMAN_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)
          docker compose -p dkman --env-file .env -f infrastructure/compose/compose.yaml -f infrastructure/compose/runtime.yaml -f tests/notes-faults.compose.yaml ps -a
          uv run python tests/diagnose_notes_ci.py
      - name: Stop only disposable CI resources
        if: always()
        run: |
          export DKMAN_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)
          ids=$(docker ps -aq --filter label=io.dkman.installation)
          if [ -n "$ids" ]; then docker rm -f $ids; fi
          docker compose -p dkman --env-file .env -f infrastructure/compose/compose.yaml -f infrastructure/compose/runtime.yaml -f tests/notes-faults.compose.yaml down

  forge-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_DB: dkman_forge_template_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d dkman_forge_template_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DKMAN_TEMPLATE_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/dkman_forge_template_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v5
        with: {node-version: '24'}
      - run: uv sync --frozen
      - run: uv run python scripts/check_forge_templates.py

  forge-buildkit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DKMAN_DISPOSABLE_BUILDKIT_TEST: '1'
      DKMAN_DISPOSABLE_DOCKER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Configure disposable builder paths
        run: |
          echo "DKMAN_TEST_BUILDKIT_SOCKET=unix://$RUNNER_TEMP/dkman-buildkit/buildkitd.sock" >> "$GITHUB_ENV"
          echo "DKMAN_BUILD_EVIDENCE_DIR=$RUNNER_TEMP/dkman-forge-evidence" >> "$GITHUB_ENV"
      - name: Install verified BuildKit on disposable runner
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/buildkit.tar.gz" https://github.com/moby/buildkit/releases/download/v0.34.1/buildkit-v0.34.1.linux-amd64.tar.gz
          echo "a59539daf547fe0958efe2d07e41c0a6944e1112a66d7e519ec1cf5b673ef15b  $RUNNER_TEMP/buildkit.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/buildkit" "$RUNNER_TEMP/dkman-buildkit"
          tar -xzf "$RUNNER_TEMP/buildkit.tar.gz" -C "$RUNNER_TEMP/buildkit"
          echo "$RUNNER_TEMP/buildkit/bin" >> "$GITHUB_PATH"
          sudo env PATH="$RUNNER_TEMP/buildkit/bin:/usr/sbin:/usr/bin:/sbin:/bin" "$RUNNER_TEMP/buildkit/bin/buildkitd" --addr "$DKMAN_TEST_BUILDKIT_SOCKET" --root "$RUNNER_TEMP/buildkit-state" > "$RUNNER_TEMP/buildkit.log" 2>&1 &
          for attempt in $(seq 1 40); do
            test -S "$RUNNER_TEMP/dkman-buildkit/buildkitd.sock" && break
            sleep 1
          done
          test -S "$RUNNER_TEMP/dkman-buildkit/buildkitd.sock"
          sudo chmod 666 "$RUNNER_TEMP/dkman-buildkit/buildkitd.sock"
      - name: Check and build each starter
        run: uv run pytest tests/test_forge_buildkit.py tests/test_forge_core_docker.py -q
      - name: Save verified BuildArtifact reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-build-evidence
          path: ${{ runner.temp }}/dkman-forge-evidence/*.json
          if-no-files-found: ignore
      - name: Show builder log on failure
        if: failure()
        run: test ! -f "$RUNNER_TEMP/buildkit.log" || tail -100 "$RUNNER_TEMP/buildkit.log"
