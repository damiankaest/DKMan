version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /apps/service-hub
    schedule: {interval: weekly}
    # Compiler upgrades require coordinated ESLint/OpenAPI compatibility testing.
    ignore:
      - dependency-name: typescript
        versions: ['>=6']
  - package-ecosystem: docker
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /tests/postgres-wasm
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /apps/service-hub
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /infrastructure/keycloak
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
